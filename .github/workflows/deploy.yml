name: Deploy Website to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Upload to Azure Blob Storage
      uses: azure/CLI@v2
      with:
        azcliversion: latest
        inlineScript: |
          az storage blob upload-batch --account-name rupeshwebsitestorage -d '$web' -s . --sas-token "${{ secrets.AZURE_STORAGE_SAS }}" --overwrite
